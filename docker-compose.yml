# Local PostgreSQL, to run the backend against the same database engine as production.
#   docker compose up -d
#   DATABASE_URL=postgresql://samavesh:samavesh@localhost:5432/samavesh  (in backend/.env)
#   uv run python -m app.seed
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: samavesh
      POSTGRES_PASSWORD: samavesh
      POSTGRES_DB: samavesh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samavesh -d samavesh"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
