[project]
name = "samavesh-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.162.5",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
